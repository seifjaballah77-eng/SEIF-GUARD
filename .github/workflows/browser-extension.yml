name: Build SEIF-GUARD browser extensions

on:
  workflow_dispatch:
  push:
    paths:
      - "browser-extension/**"
      - ".github/workflows/browser-extension.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package Chromium extension
        run: |
          mkdir -p dist/chromium
          cp -R browser-extension/. dist/chromium/
          rm -f dist/chromium/manifest.firefox.json
          cd dist
          zip -r SEIF-GUARD-Chromium.zip chromium
          cd ..

      - name: Package Firefox extension
        run: |
          mkdir -p dist/firefox
          cp -R browser-extension/. dist/firefox/
          cp dist/firefox/manifest.firefox.json dist/firefox/manifest.json
          rm -f dist/firefox/manifest.firefox.json
          cd dist
          zip -r SEIF-GUARD-Firefox.zip firefox
          cd ..

      - name: Publish direct browser downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: browser-latest
          name: SEIF-GUARD Browser Extensions (latest)
          target_commitish: ${{ github.sha }}
          update_tag: true
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            dist/SEIF-GUARD-Chromium.zip
            dist/SEIF-GUARD-Firefox.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload extension packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEIF-GUARD-browser-extensions
          path: |
            dist/SEIF-GUARD-Chromium.zip
            dist/SEIF-GUARD-Firefox.zip
          if-no-files-found: error
